name: ecommerce-dev

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: thuctaptotnghiep
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the schema n8n stores its workflows in - see the file.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - ecommerce-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Spring Boot Application (Scalable)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Remove container_name to allow multiple instances
    # container_name: ecommerce-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # All secrets come from .env file in this directory (see .env.example)
      SPRING_PROFILES_ACTIVE: staging
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      # Email - Brevo HTTP API (primary) + Gmail SMTP (fallback)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    networks:
      - ecommerce-network
    volumes:
      - backend_logs:/var/log/ecommerce
    # Health check disabled - app is working fine, just endpoint blocked by security
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    deploy:
      replicas: 3  # Default 3 instances for load balancing
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # n8n - the automation layer behind "Tự động hóa". Opt in with
  #   docker compose --profile automation up -d n8n
  # so the everyday `up -d postgres redis kafka zookeeper` is unchanged.
  # Full setup, including the workflow to import, in ../n8n/README.md.
  n8n:
    image: n8nio/n8n:2.40.5
    container_name: ecommerce-n8n
    profiles: ["automation"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # State lives in Postgres, not in the container, so this can be
      # recreated at will and runs on a host with no persistent disk.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: thuctaptotnghiep
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${DB_USERNAME:-postgres}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Encrypts the Telegram/Google credentials n8n saves. The default below
      # is dev-only and deliberately not a secret; set N8N_ENCRYPTION_KEY in
      # .env for anything else, and keep it - change it and every credential
      # already stored becomes unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-tryum-local-dev-key-not-a-secret}
      # No basic-auth variables here on purpose: n8n removed them in 1.0 and
      # silently ignores them now. The login is the owner account created in
      # the browser on first run (http://localhost:5678/setup) and stored in
      # the database, which means it survives a container rebuild but is lost
      # if the n8n schema is dropped.
      # What n8n prints as a node's webhook URL. Point it at the tunnel when
      # testing against anything that is not on this machine. (Called
      # WEBHOOK_URL before 2.x, which still works but warns on every boot.)
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      # The Code node needs Node's crypto to check Tryum's signature; n8n
      # blocks every builtin unless it is named here.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Read by the workflow, not by n8n itself. Same string as the backend's
      # AUTOMATION_WEBHOOK_SECRET - that is the whole point of it.
      TRYUM_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-}
      # Where Phase 1 sends alerts. Becomes per-store config once the
      # "Tự động hóa" tab exists; until then, one chat for the demo shop.
      TRYUM_TELEGRAM_CHAT_ID: ${TRYUM_TELEGRAM_CHAT_ID:-}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      # Execution history shares the app's database, so it is not allowed to
      # grow without limit: keep a week and prune the rest.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    ports:
      - "5678:5678"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  backend_logs:
