# Overrides for the "test" profile, used by the Testcontainers integration
# tests. Database and Redis are wired by @ServiceConnection, not from here.

# application.properties imports backend/.env when one exists, which on a
# developer's machine means the real automation settings - a live webhook URL
# and a working secret. Left alone, every integration test would start
# sweeping the outbox and posting to whatever n8n that developer has running.
# Tests do not send webhooks.
automation.enabled=false
