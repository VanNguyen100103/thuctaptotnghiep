<div class="relative">
  @if (label(); as text) {
    <button
      type="button"
      (click)="toggleOpen()"
      [disabled]="disabled()"
      class="flex h-8 items-center gap-1.5 rounded-md border border-gray-300 bg-white px-3 text-[13px] text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
    >
      <ng-content />
      {{ text }}
      <svg class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
  } @else {
    <button
      type="button"
      (click)="toggleOpen()"
      [disabled]="disabled()"
      [attr.aria-label]="ariaLabel()"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
    >
      <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" />
      </svg>
    </button>
  }

  @if (open()) {
    <div
      class="absolute z-30 mt-1 w-64 rounded-md border border-gray-200 bg-white py-1 shadow-lg"
      [class.right-0]="align() === 'right'"
      [class.left-0]="align() === 'left'"
    >
      @for (item of items(); track item.key) {
        @if (item.separatorBefore) {
          <div class="my-1 border-t border-gray-100"></div>
        }
        <button
          type="button"
          (click)="select(item)"
          [disabled]="item.disabled"
          [title]="item.disabled ? (item.disabledReason ?? '') : ''"
          class="block w-full px-4 py-2 text-left text-[13px] hover:bg-gray-50 disabled:cursor-not-allowed disabled:bg-white disabled:text-gray-300"
          [class.text-red-600]="item.danger && !item.disabled"
          [class.text-gray-700]="!item.danger && !item.disabled"
        >
          {{ item.label }}
        </button>
      }
    </div>
  }
</div>
