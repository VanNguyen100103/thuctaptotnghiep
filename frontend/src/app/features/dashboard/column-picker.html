<div class="relative" (click)="$event.stopPropagation()">
  <button
    type="button"
    (click)="toggleOpen()"
    title="Chọn cột hiển thị"
    aria-label="Chọn cột hiển thị"
    class="flex h-8 w-8 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-600 hover:bg-gray-50"
    [class.border-blue-500]="open()"
    [class.text-blue-600]="open()"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
    </svg>
  </button>

  @if (open()) {
    <div class="absolute right-0 top-full z-20 mt-1 max-h-80 w-56 overflow-y-auto rounded-md border border-gray-200 bg-white py-1 shadow-xl">
      @for (column of columns(); track column.key) {
        <label class="flex cursor-pointer items-center gap-2 px-3 py-1.5 text-[13px] text-gray-700 hover:bg-gray-50">
          <input type="checkbox" [checked]="isVisible(column.key)" (change)="toggle(column.key)" class="h-4 w-4 rounded border-gray-300" />
          {{ column.label }}
        </label>
      }
    </div>
  }
</div>
