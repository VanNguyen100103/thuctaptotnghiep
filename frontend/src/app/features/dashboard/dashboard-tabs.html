<nav class="-mx-4 flex items-center justify-between gap-2 bg-blue-600 px-4 sm:mx-0 sm:rounded-md">
  <div class="flex flex-wrap items-center">
    <a
      routerLink="/dashboard"
      routerLinkActive
      #rlaOverview="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
      [class.bg-blue-700]="rlaOverview.isActive"
      [class.text-white]="rlaOverview.isActive"
    >
      Tổng quan
    </a>
    <a
      routerLink="/dashboard/products"
      routerLinkActive
      #rlaProducts="routerLinkActive"
      class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
      [class.bg-blue-700]="rlaProducts.isActive"
      [class.text-white]="rlaProducts.isActive"
    >
      Hàng hóa
    </a>
    @for (tab of upcomingTabs; track tab) {
      <button
        type="button"
        disabled
        [title]="'Sắp ra mắt'"
        class="cursor-not-allowed px-3 py-3 text-sm font-medium text-blue-300"
      >
        {{ tab }}
      </button>
    }
  </div>

  <button
    type="button"
    disabled
    title="Sắp ra mắt"
    class="my-1.5 shrink-0 cursor-not-allowed rounded-full bg-white/90 px-4 py-1.5 text-sm font-medium text-blue-700"
  >
    Bán hàng
  </button>
</nav>
