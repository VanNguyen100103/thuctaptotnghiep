<nav class="relative -mx-4 flex items-center justify-between gap-2 bg-blue-600 px-4 sm:mx-0 sm:rounded-md">
  <div class="flex flex-wrap items-center">
    <a
      routerLink="/dashboard"
      routerLinkActive
      #rlaOverview="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
      [class.bg-blue-700]="rlaOverview.isActive"
      [class.text-white]="rlaOverview.isActive"
    >
      Tổng quan
    </a>
    <a
      routerLink="/dashboard/products"
      routerLinkActive
      #rlaProducts="routerLinkActive"
      class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
      [class.bg-blue-700]="rlaProducts.isActive"
      [class.text-white]="rlaProducts.isActive"
    >
      Hàng hóa
    </a>

    <div class="relative" (mouseenter)="openPurchasingMenu()" (mouseleave)="closePurchasingMenu()">
      <button
        type="button"
        class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
        [class.bg-blue-700]="purchasingActive() || purchasingMenuOpen()"
        [class.text-white]="purchasingActive() || purchasingMenuOpen()"
      >
        Mua hàng
      </button>
      @if (purchasingMenuOpen()) {
        <div class="absolute left-0 top-full z-20 w-[30rem] rounded-md border border-gray-200 bg-white p-4 text-left shadow-xl">
          <div class="grid grid-cols-2 gap-6">
            <div>
              <p class="text-xs font-semibold uppercase tracking-wide text-gray-400">Nhà cung cấp</p>
              <div class="mt-2 space-y-0.5">
                <a
                  routerLink="/dashboard/suppliers"
                  (click)="closePurchasingMenu()"
                  class="block rounded px-2 py-1.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600"
                >
                  Nhà cung cấp
                </a>
                <button
                  type="button"
                  disabled
                  title="Sắp ra mắt"
                  class="flex w-full cursor-not-allowed items-center gap-2 rounded px-2 py-1.5 text-left text-sm text-gray-400"
                >
                  Hóa đơn đầu vào
                  <span class="rounded bg-red-50 px-1.5 py-0.5 text-[10px] font-medium text-red-400">Mới</span>
                </button>
              </div>
            </div>
            <div>
              <p class="text-xs font-semibold uppercase tracking-wide text-gray-400">Mua hàng</p>
              <div class="mt-2 space-y-0.5">
                <button
                  type="button"
                  disabled
                  title="Sắp ra mắt"
                  class="block w-full cursor-not-allowed rounded px-2 py-1.5 text-left text-sm text-gray-400"
                >
                  Đặt hàng nhập
                </button>
                <a
                  routerLink="/dashboard/purchase-orders"
                  (click)="closePurchasingMenu()"
                  class="block rounded px-2 py-1.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600"
                >
                  Nhập hàng
                </a>
                <button
                  type="button"
                  disabled
                  title="Sắp ra mắt"
                  class="block w-full cursor-not-allowed rounded px-2 py-1.5 text-left text-sm text-gray-400"
                >
                  Trả hàng nhập
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="relative" (mouseenter)="openOrdersMenu()" (mouseleave)="closeOrdersMenu()">
      <button
        type="button"
        class="px-3 py-3 text-sm font-medium text-blue-100 hover:text-white"
        [class.bg-blue-700]="ordersMenuOpen()"
        [class.text-white]="ordersMenuOpen()"
      >
        Đơn hàng
      </button>
      @if (ordersMenuOpen()) {
        <div class="absolute left-0 top-full z-20 w-56 rounded-md border border-gray-200 bg-white p-2 text-left shadow-xl">
          @for (item of orderMenuItems; track item) {
            <button
              type="button"
              disabled
              title="Sắp ra mắt"
              class="block w-full cursor-not-allowed rounded px-2 py-1.5 text-left text-sm text-gray-400"
            >
              {{ item }}
            </button>
          }
        </div>
      }
    </div>

    @for (tab of upcomingTabs; track tab) {
      <button
        type="button"
        disabled
        [title]="'Sắp ra mắt'"
        class="cursor-not-allowed px-3 py-3 text-sm font-medium text-blue-300"
      >
        {{ tab }}
      </button>
    }
  </div>

  <a
    routerLink="/dashboard/pos"
    class="my-1.5 shrink-0 rounded-full bg-white px-4 py-1.5 text-sm font-medium text-blue-700 hover:bg-white/90"
  >
    Bán hàng
  </a>
</nav>
