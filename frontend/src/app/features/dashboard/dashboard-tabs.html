<nav class="flex items-center justify-between border-b border-gray-200">
  <div class="flex flex-wrap gap-1">
    <a
      routerLink="/dashboard"
      routerLinkActive
      #rlaOverview="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      class="border-b-2 px-3 py-2 text-sm font-medium"
      [class.border-blue-600]="rlaOverview.isActive"
      [class.text-blue-600]="rlaOverview.isActive"
      [class.border-transparent]="!rlaOverview.isActive"
      [class.text-gray-500]="!rlaOverview.isActive"
    >
      Tổng quan
    </a>
    <a
      routerLink="/dashboard/products"
      routerLinkActive
      #rlaProducts="routerLinkActive"
      class="border-b-2 px-3 py-2 text-sm font-medium"
      [class.border-blue-600]="rlaProducts.isActive"
      [class.text-blue-600]="rlaProducts.isActive"
      [class.border-transparent]="!rlaProducts.isActive"
      [class.text-gray-500]="!rlaProducts.isActive"
    >
      Hàng hóa
    </a>
    @for (tab of upcomingTabs; track tab) {
      <button
        type="button"
        disabled
        [title]="'Sắp ra mắt'"
        class="cursor-not-allowed border-b-2 border-transparent px-3 py-2 text-sm font-medium text-gray-400"
      >
        {{ tab }}
      </button>
    }
  </div>

  <button
    type="button"
    disabled
    title="Sắp ra mắt"
    class="mb-1 cursor-not-allowed rounded-full bg-blue-300 px-4 py-1.5 text-sm font-medium text-white"
  >
    Bán hàng
  </button>
</nav>
