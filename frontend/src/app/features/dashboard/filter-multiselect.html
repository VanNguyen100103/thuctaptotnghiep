<div class="relative">
  <div
    (click)="toggleOpen()"
    class="flex min-h-[2rem] w-full cursor-pointer flex-wrap items-center gap-1 rounded border bg-white px-2 py-1 pr-7 text-[13px]"
    [class.border-blue-500]="open()"
    [class.border-gray-300]="!open()"
  >
    @if (visibleChips().length === 0) {
      <span class="text-gray-400">{{ placeholder() }}</span>
    }
    @for (chip of visibleChips(); track chip.value) {
      <span class="inline-flex items-center gap-1 rounded bg-blue-50 px-1.5 py-0.5 text-xs font-medium text-blue-700">
        {{ chip.label }}
        <button
          type="button"
          (click)="$event.stopPropagation(); remove(chip.value)"
          [attr.aria-label]="'Bỏ ' + chip.label"
          class="leading-none text-blue-400 hover:text-blue-700"
        >
          ×
        </button>
      </span>
    }
    @if (hiddenCount() > 0) {
      <span class="rounded bg-gray-100 px-1.5 py-0.5 text-xs font-medium text-gray-600">+{{ hiddenCount() }} khác</span>
    }
    <svg
      class="pointer-events-none absolute right-2 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-gray-400"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </div>

  @if (open()) {
    <div class="absolute left-0 right-0 top-full z-20 mt-1 max-h-64 overflow-y-auto rounded border border-gray-200 bg-white py-1 shadow-xl">
      <div class="flex items-center justify-between border-b border-gray-100 px-3 pb-1.5 text-xs">
        <button type="button" (click)="selectAll()" class="text-blue-600 hover:underline">Chọn tất cả</button>
        <button type="button" (click)="clear()" class="text-gray-500 hover:underline">Bỏ chọn</button>
      </div>
      @for (option of options(); track option.value) {
        <label class="flex cursor-pointer items-center gap-2 px-3 py-1.5 text-[13px] text-gray-700 hover:bg-gray-50">
          <input type="checkbox" [checked]="isChecked(option.value)" (change)="toggle(option.value)" class="h-4 w-4 rounded border-gray-300" />
          {{ option.label }}
        </label>
      }
    </div>
  }
</div>
