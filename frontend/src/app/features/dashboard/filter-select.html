<div class="relative">
  <button
    type="button"
    (click)="toggleOpen()"
    [attr.aria-expanded]="open()"
    class="flex h-8 w-full items-center gap-1 rounded border bg-white px-2 text-left text-[13px]"
    [class.border-blue-500]="open()"
    [class.border-gray-300]="!open()"
  >
    <span class="min-w-0 flex-1 truncate" [class.text-gray-400]="!selectedLabel()" [class.text-gray-700]="selectedLabel()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <svg class="h-3.5 w-3.5 shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>

  @if (open()) {
    <div class="absolute left-0 right-0 top-full z-20 mt-1 max-h-64 overflow-y-auto rounded border border-gray-200 bg-white py-1 shadow-xl">
      @for (option of options(); track option.value) {
        <button
          type="button"
          (click)="select(option.value)"
          class="block w-full px-3 py-1.5 text-left text-[13px] hover:bg-gray-50"
          [class.bg-blue-50]="option.value === value()"
          [class.text-blue-600]="option.value === value()"
          [class.text-gray-700]="option.value !== value()"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
