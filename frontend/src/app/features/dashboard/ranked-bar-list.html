<div class="rounded-lg border border-gray-200 bg-white p-4">
  <p class="text-sm font-medium text-gray-700">{{ title() }}</p>

  @if (rows().length === 0) {
    <p class="mt-3 text-sm text-gray-500">{{ emptyMessage() }}</p>
  } @else {
    <ul class="mt-3 space-y-3">
      @for (row of rows(); track row.label) {
        <li>
          <div class="flex items-center justify-between text-sm">
            <span class="truncate pr-2 text-gray-700">{{ row.label }}</span>
            <span class="shrink-0 font-medium text-gray-900">{{ row.formattedValue }}</span>
          </div>
          <div class="mt-1 h-1.5 w-full rounded-full bg-gray-100">
            <div class="h-1.5 rounded-full bg-blue-600" [style.width.%]="barWidthPercent(row.value)"></div>
          </div>
        </li>
      }
    </ul>
  }
</div>
