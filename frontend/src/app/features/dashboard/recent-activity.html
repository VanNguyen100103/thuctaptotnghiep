<div class="rounded-lg border border-gray-200 bg-white p-4">
  <p class="text-sm font-medium text-gray-700">Hoạt động gần đây</p>

  @if (activities().length === 0) {
    <p class="mt-3 text-sm text-gray-500">Chưa có hoạt động nào.</p>
  } @else {
    <ul class="mt-3 space-y-3">
      @for (activity of activities(); track activity.timestamp + activity.description) {
        <li class="text-sm">
          <p class="text-gray-700">{{ activity.description }}</p>
          <p class="text-xs text-gray-400">{{ relativeTime(activity.timestamp) }}</p>
        </li>
      }
    </ul>
  }
</div>
