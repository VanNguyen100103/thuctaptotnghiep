<!--
  Closed, this is one search box. Open, KiotViet grows the box into a card
  with the box itself as the card's first row and the other fields underneath,
  so the outer div keeps the toolbar row's height while the card floats over
  it - otherwise the whole toolbar jumps every time the panel opens.
-->
<div class="relative h-8 w-72">
  <div
    [class]="
      open()
        ? 'absolute left-0 top-0 z-30 w-[26rem] rounded-md border border-gray-200 bg-white p-2.5 shadow-xl'
        : 'w-full'
    "
  >
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z" />
      </svg>
      <input
        type="text"
        [placeholder]="primaryField().placeholder"
        [value]="values()[primaryField().key] || ''"
        (input)="onPrimaryInput($event)"
        class="h-8 w-full rounded-md border border-gray-300 bg-white pl-9 pr-9 text-[13px]"
      />
      <button
        type="button"
        (click)="togglePanel()"
        [attr.aria-expanded]="open()"
        aria-label="Tìm kiếm nâng cao"
        title="Tìm kiếm nâng cao"
        class="absolute right-1.5 top-1/2 flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded text-gray-400 hover:bg-gray-100 hover:text-gray-600"
        [class.text-blue-600]="open() || hasAdvanced()"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9m-9 6h9m-9 6h9M4.5 6h.008v.008H4.5V6Zm0 6h.008v.008H4.5V12Zm0 6h.008v.008H4.5V18Z" />
        </svg>
        @if (hasAdvanced()) {
          <span class="absolute -right-0.5 -top-0.5 h-1.5 w-1.5 rounded-full bg-blue-600"></span>
        }
      </button>
    </div>

    @if (open()) {
      <div class="mt-2.5 space-y-2">
        @for (field of panelFields(); track field.key) {
          <input
            type="text"
            [placeholder]="field.placeholder"
            [value]="draftValue(field.key)"
            (input)="onDraftInput(field.key, $event)"
            (keydown.enter)="apply()"
            class="h-8 w-full rounded border border-gray-300 px-2.5 text-[13px]"
          />
        }
      </div>
      <div class="mt-3 flex items-center justify-end gap-2">
        <button type="button" (click)="collapse()" class="h-8 rounded-md border border-gray-300 px-3 text-[13px] text-gray-700 hover:bg-gray-50">
          Thu gọn
        </button>
        <button type="button" (click)="apply()" class="h-8 rounded-md bg-blue-600 px-4 text-[13px] font-medium text-white hover:bg-blue-700">
          Tìm kiếm
        </button>
      </div>
    }
  </div>
</div>
