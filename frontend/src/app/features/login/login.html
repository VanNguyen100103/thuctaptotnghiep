<div class="flex lg:min-h-[calc(100vh-73px)]">
  <div class="relative hidden w-1/2 shrink-0 bg-gradient-to-br from-blue-800 to-blue-600 lg:flex lg:items-center">
    <div class="px-16 py-16">
      <h2 class="text-4xl font-bold leading-tight text-white">
        Quản lý dễ dàng<br />Bán hàng đơn giản
      </h2>
      <p class="mt-6 max-w-sm text-blue-100">
        Đăng nhập để xem đơn hàng, sản phẩm và doanh thu của cửa hàng bạn.
      </p>
    </div>
  </div>

  <section class="flex w-full items-center justify-center px-4 py-16 lg:w-1/2 lg:px-16">
    <div class="w-full max-w-sm">
      <h1 class="text-2xl font-semibold text-gray-900">Đăng nhập</h1>

      @if (formError()) {
        <div class="mt-6 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ formError() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
          <input type="text" formControlName="username" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
          <input type="password" formControlName="password" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
        </div>

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full rounded-md bg-blue-600 px-4 py-2.5 text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ submitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-gray-600">
        Chưa có cửa hàng? <a routerLink="/register" class="text-blue-600 underline">Đăng ký</a>
      </p>
    </div>
  </section>
</div>
