<section class="mx-auto max-w-sm px-4 py-16">
  <h1 class="text-2xl font-semibold text-gray-900">Đăng nhập</h1>

  @if (formError()) {
    <div class="mt-6 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ formError() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
      <input type="text" formControlName="username" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
      <input type="password" formControlName="password" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
    </div>

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-md bg-gray-900 px-4 py-2.5 text-white hover:bg-gray-800 disabled:opacity-50"
    >
      {{ submitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-gray-600">
    Chưa có cửa hàng? <a routerLink="/register" class="text-gray-900 underline">Đăng ký</a>
  </p>
</section>
