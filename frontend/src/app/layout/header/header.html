<header class="border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a routerLink="/" class="text-lg font-bold text-blue-600">Thuctaptotnghiep</a>

    @if (currentUser(); as user) {
      <nav class="flex items-center gap-4 text-sm">
        <a routerLink="/dashboard" class="text-gray-700 hover:text-gray-900">Dashboard</a>
        @if (activeStoreSlug(); as storeSlug) {
          <a [routerLink]="['/store', storeSlug, 'cart']" class="relative text-gray-700 hover:text-gray-900" aria-label="Giỏ hàng">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.836l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.973-4.798 2.517-7.427.089-.428-.191-.827-.652-.827H5.106M7.5 14.25 5.106 5.25M7.5 14.25 4.5 6.75m3 7.5A3 3 0 0 1 4.5 6.75" />
            </svg>
            @if (cartItemCount() > 0) {
              <span
                class="absolute -right-2 -top-2 min-w-[1.1rem] rounded-full bg-blue-600 px-1 text-center text-[10px] leading-4 text-white"
              >
                {{ cartItemCount() }}
              </span>
            }
          </a>
        }
        <span class="text-gray-400">{{ user.username }}</span>
        <button
          type="button"
          (click)="logout()"
          class="rounded-md border border-gray-300 px-3 py-1.5 text-gray-700 hover:bg-gray-50"
        >
          Đăng xuất
        </button>
      </nav>
    } @else {
      <nav class="flex items-center gap-3 text-sm">
        <a routerLink="/login" class="text-gray-700 hover:text-gray-900">Đăng nhập</a>
        <a
          routerLink="/register"
          class="rounded-full bg-blue-600 px-4 py-1.5 font-medium text-white hover:bg-blue-700"
        >
          Dùng thử miễn phí
        </a>
      </nav>
    }
  </div>
</header>
