<header class="border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a routerLink="/" class="text-lg font-semibold text-gray-900">Thuctaptotnghiep</a>

    @if (currentUser(); as user) {
      <nav class="flex items-center gap-4 text-sm">
        <a routerLink="/dashboard" class="text-gray-700 hover:text-gray-900">Dashboard</a>
        <span class="text-gray-400">{{ user.username }}</span>
        <button
          type="button"
          (click)="logout()"
          class="rounded-md border border-gray-300 px-3 py-1.5 text-gray-700 hover:bg-gray-50"
        >
          Đăng xuất
        </button>
      </nav>
    } @else {
      <nav class="flex items-center gap-3 text-sm">
        <a routerLink="/login" class="text-gray-700 hover:text-gray-900">Đăng nhập</a>
        <a
          routerLink="/register"
          class="rounded-md bg-gray-900 px-3 py-1.5 text-white hover:bg-gray-800"
        >
          Dùng thử miễn phí
        </a>
      </nav>
    }
  </div>
</header>
